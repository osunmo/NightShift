<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nightshift</title>
<link rel="icon" href="data:," />
<style>
  @font-face { font-family: Onest; font-weight: 400; font-display: swap; src: url(/fonts/onest-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Onest; font-weight: 500; font-display: swap; src: url(/fonts/onest-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: Onest; font-weight: 600; font-display: swap; src: url(/fonts/onest-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Onest; font-weight: 700; font-display: swap; src: url(/fonts/onest-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(/fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }

  :root {
    --ink: #1a1a1a; --ink2: #5d5d5d; --mute: #7e7e7e; --line: #e5e5e5; --soft: #f6f6f6; --soft2: #efefef; --white: #fff;
    --blue: #2558ff; --blue-ink: #0b2fb8; --dark: #1a1a1a; --dark2: #272727; --dark3: #333; --dline: rgba(255,255,255,.1);
    --ok: #12a150; --ok-bg: #e8f7ee; --bad: #e5484d; --bad-bg: #fdecec; --warn: #d9822b; --warn-bg: #fdf3e7;
    --orch: #c9b8ff; --coder: #8fb3ff; --qa: #7fe0a8; --debugger: #ffbf85;
    --sans: Onest, system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --shadow: 0 1px 1px rgba(0,0,0,.04), 0 2px 4px rgba(0,0,0,.04), 0 0 0 .5px rgba(0,0,0,.1);
    --lift: 0 2px 6px rgba(26,26,26,.04), 0 18px 40px rgba(26,26,26,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.5 var(--sans); color: var(--ink); background: var(--white); letter-spacing: -.1px; -webkit-font-smoothing: antialiased; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; border: 0; }
  input, textarea, select { font: inherit; color: inherit; }
  .eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .6px; text-transform: uppercase; color: var(--mute); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 8px; font-weight: 500; font-size: 14px; letter-spacing: -.2px; background: var(--white); color: var(--ink); box-shadow: var(--shadow); }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--blue); color: #fff; font-weight: 600; box-shadow: inset 1px 1px 1px rgba(255,255,255,.3), inset -1px -1px 1px rgba(255,255,255,.05), 0 4px 14px rgba(37,88,255,.25); }
  .btn.primary:hover { background: #1f4de6; }
  .btn.ghost { box-shadow: none; background: transparent; color: var(--ink2); }
  .btn.ghost:hover { background: var(--soft); color: var(--ink); }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.sm { padding: 6px 10px; font-size: 13px; }

  /* ---------- top bar ---------- */
  .bar { height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.9); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 4; }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; letter-spacing: -.6px; cursor: pointer; }
  .logo i { width: 22px; height: 22px; border-radius: 7px; background: var(--dark); position: relative; display: inline-block; }
  .logo i::after { content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--white); top: 5px; left: 8px; box-shadow: -3px 1px 0 0 var(--dark) inset; }
  .tabs { display: flex; gap: 2px; margin-left: 8px; }
  .tabs .btn { box-shadow: none; background: transparent; }
  .tabs .btn.on { background: var(--soft); }
  .env { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .chip { font: 500 12px/1 var(--mono); padding: 6px 9px; border-radius: 99px; background: var(--soft); color: var(--ink2); text-transform: uppercase; letter-spacing: .4px; }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }

  /* ---------- home ---------- */
  .home { max-width: 860px; margin: 0 auto; padding: 72px 24px 80px; }
  .home h1 { font-size: 56px; line-height: 1.02; letter-spacing: -2.2px; margin: 14px 0 12px; font-weight: 700; }
  .home .sub { font-size: 19px; color: var(--ink2); margin: 0 0 32px; max-width: 620px; }
  .composer { background: var(--soft); border-radius: 16px; padding: 4px; }
  .composer .inner { background: var(--white); border-radius: 12px; box-shadow: var(--lift); padding: 18px 18px 14px; }
  .composer textarea { width: 100%; border: 0; outline: 0; resize: none; font-size: 18px; letter-spacing: -.3px; min-height: 92px; line-height: 1.45; }
  .composer textarea::placeholder { color: #a3a3a3; }
  .composer .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .field { display: flex; align-items: center; gap: 8px; background: var(--soft); border-radius: 8px; padding: 0 10px; height: 38px; }
  .field span { font: 500 11px var(--mono); text-transform: uppercase; color: var(--mute); letter-spacing: .4px; }
  .field input { border: 0; outline: 0; background: transparent; height: 100%; min-width: 0; font-size: 14px; }
  .field.repo { flex: 1 1 280px; } .field.repo input { width: 100%; }
  .field.branch input { width: 70px; }
  .seg { display: flex; background: var(--soft); border-radius: 8px; padding: 3px; gap: 2px; height: 38px; align-items: center; }
  .seg span { font: 500 11px var(--mono); text-transform: uppercase; color: var(--mute); padding: 0 6px 0 7px; letter-spacing: .4px; }
  .seg button { width: 30px; height: 32px; border-radius: 6px; background: transparent; color: var(--ink2); font-weight: 600; font-size: 14px; }
  .seg button.on { background: var(--white); color: var(--ink); box-shadow: var(--shadow); }
  .composer .go { margin-left: auto; }
  .ideas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .idea { background: var(--white); box-shadow: var(--shadow); border-radius: 99px; padding: 8px 14px; font-size: 14px; color: var(--ink2); cursor: pointer; }
  .idea:hover { color: var(--ink); background: var(--soft); }
  .how { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 56px; }
  .how div { background: var(--soft); border-radius: 12px; padding: 16px; }
  .how b { display: block; font-size: 15px; letter-spacing: -.3px; margin: 10px 0 4px; }
  .how p { margin: 0; font-size: 13px; color: var(--ink2); line-height: 1.45; }
  .dotk { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .recent { margin-top: 56px; }
  .recent h2 { font-size: 28px; letter-spacing: -1px; margin: 10px 0 14px; }
  .list { background: var(--soft); border-radius: 14px; padding: 4px; display: grid; gap: 4px; }
  .item { background: var(--white); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; cursor: pointer; align-items: center; }
  .item:hover { box-shadow: var(--shadow); }
  .item .t { font-weight: 500; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .m { font-size: 13px; color: var(--mute); grid-column: 1; }
  .item .st { grid-row: 1 / span 2; grid-column: 2; }
  .empty-list { padding: 22px; color: var(--mute); text-align: center; background: var(--white); border-radius: 10px; }

  .status { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .4px; padding: 6px 9px; border-radius: 99px; background: var(--soft); color: var(--ink2); white-space: nowrap; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .9; }
  .status.done, .status.passed, .status.shipped { background: var(--ok-bg); color: var(--ok); }
  .status.failed, .status.cancelled { background: var(--bad-bg); color: var(--bad); }
  .status.running, .status.planning, .status.evaluating, .status.queued, .status.setup, .status.coding, .status.qa, .status.debugging { background: #eaf0ff; color: var(--blue); }
  .status.running::before, .status.planning::before, .status.evaluating::before, .status.setup::before, .status.coding::before, .status.qa::before, .status.debugging::before { animation: pulse 1.1s infinite; }
  .status.paused { background: var(--warn-bg); color: var(--warn); }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ---------- task view ---------- */
  .task { display: grid; grid-template-columns: 420px 1fr; height: calc(100vh - 60px); }
  /* agent chat (dark) */
  .chat { background: var(--dark); color: #eee; display: flex; flex-direction: column; min-height: 0; }
  .chat .head { padding: 16px 20px; border-bottom: 1px solid var(--dline); display: flex; align-items: center; gap: 10px; }
  .chat .head b { font-size: 15px; letter-spacing: -.2px; }
  .chat .head .eyebrow { color: rgba(255,255,255,.45); margin-left: auto; }
  .team { display: flex; gap: 6px; padding: 12px 20px; border-bottom: 1px solid var(--dline); flex-wrap: wrap; }
  .who { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .4px; color: rgba(255,255,255,.6); }
  .who i { width: 8px; height: 8px; border-radius: 3px; }
  .r-orchestrator i, i.r-orchestrator { background: var(--orch); } .r-coder i, i.r-coder { background: var(--coder); } .r-qa i, i.r-qa { background: var(--qa); } .r-debugger i, i.r-debugger { background: var(--debugger); } .r-user i, .r-system i { background: #fff; }
  .msgs { flex: 1; overflow: auto; padding: 18px 20px 10px; display: flex; flex-direction: column; gap: 14px; }
  .m { max-width: 100%; }
  .m .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .m .meta small { color: rgba(255,255,255,.4); font: 400 11px var(--mono); }
  .m .bubble { background: var(--dark2); border: 1px solid var(--dline); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.5; color: #e8e8e8; white-space: pre-wrap; word-break: break-word; }
  .m.user { align-self: flex-end; max-width: 88%; }
  .m.user .bubble { background: var(--blue); border-color: transparent; color: #fff; }
  .m.user .meta { justify-content: flex-end; }
  .m .bubble ol, .m .bubble ul { margin: 6px 0 0; padding-left: 18px; white-space: normal; }
  .m .bubble li { margin: 2px 0; }
  .m .bubble b { color: #fff; }
  .m.pass .bubble { border-color: rgba(127,224,168,.35); background: rgba(18,161,80,.12); }
  .m.fail .bubble { border-color: rgba(229,72,77,.4); background: rgba(229,72,77,.12); }
  .m.win .bubble { border-color: rgba(201,184,255,.5); background: rgba(201,184,255,.1); }
  .note { font: 400 12px var(--mono); color: rgba(255,255,255,.4); text-align: center; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); animation: pulse 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  .send { padding: 12px 14px 16px; }
  .send .box { background: var(--dark2); border: 1px solid var(--dline); border-radius: 12px; padding: 10px 10px 8px 14px; }
  .send textarea { width: 100%; background: transparent; border: 0; outline: 0; resize: none; color: #fff; font-size: 14px; min-height: 40px; }
  .send textarea::placeholder { color: rgba(255,255,255,.35); }
  .send .row { display: flex; align-items: center; gap: 8px; }
  .send select { background: var(--dark3); color: #ddd; border: 0; border-radius: 7px; padding: 6px 8px; font-size: 12px; outline: 0; }
  .send .btn.primary { margin-left: auto; padding: 7px 12px; font-size: 13px; }
  .send .hint { font: 400 11px var(--mono); color: rgba(255,255,255,.35); margin-top: 8px; text-align: center; }

  /* work canvas */
  .work { overflow: auto; background: var(--white); }
  .work .top { padding: 28px 32px 18px; }
  .work h1 { font-size: 30px; line-height: 1.12; letter-spacing: -1.1px; margin: 10px 0 10px; font-weight: 700; }
  .work .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--mute); font-size: 13px; }
  .work .meta code { font: 400 12.5px var(--mono); color: var(--ink2); background: var(--soft); padding: 3px 7px; border-radius: 6px; }
  .work .actions { margin-left: auto; display: flex; gap: 6px; }
  .result { margin: 0 32px 18px; background: var(--soft); border-radius: 14px; padding: 4px; }
  .result .inner { background: var(--white); border-radius: 10px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow); }
  .result .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; flex: none; }
  .result.ok .ico { background: var(--ok-bg); color: var(--ok); } .result.bad .ico { background: var(--bad-bg); color: var(--bad); }
  .result b { display: block; letter-spacing: -.2px; }
  .result span { color: var(--ink2); font-size: 14px; }
  .result .btn { margin-left: auto; flex: none; }
  .section-h { display: flex; align-items: baseline; gap: 10px; padding: 8px 32px 10px; }
  .section-h h3 { margin: 0; font-size: 19px; letter-spacing: -.5px; }
  .attempts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; padding: 0 32px 24px; align-items: start; }
  .att { background: var(--soft); border-radius: 14px; padding: 4px; cursor: pointer; transition: transform .12s; }
  .att:hover { transform: translateY(-1px); }
  .att.sel { background: #dfe7ff; }
  .att .inner { background: var(--white); border-radius: 10px; padding: 14px; box-shadow: var(--shadow); }
  .att .h { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .att .n { font: 500 11px var(--mono); color: var(--mute); text-transform: uppercase; letter-spacing: .4px; }
  .att .name { font-weight: 600; font-size: 16px; letter-spacing: -.4px; margin: 4px 0 2px; }
  .att .ins { font-size: 13px; color: var(--ink2); line-height: 1.4; min-height: 36px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pipe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 12px 0 10px; }
  .pipe div { font: 500 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .3px; color: var(--mute); }
  .pipe div::before { content: ""; display: block; height: 4px; border-radius: 3px; background: var(--soft2); margin-bottom: 6px; }
  .pipe .ok::before { background: var(--ok); } .pipe .on::before { background: var(--blue); animation: pulse 1.1s infinite; } .pipe .bad::before { background: var(--bad); }
  .pipe .ok, .pipe .on { color: var(--ink2); }
  .stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--mute); }
  .stats b { color: var(--ink); font-weight: 600; }
  .att .foot { display: flex; gap: 6px; margin-top: 12px; }
  .detail { margin: 0 32px 40px; background: var(--soft); border-radius: 14px; padding: 4px; }
  .detail .tabbar { display: flex; gap: 2px; padding: 6px 6px 8px; align-items: center; }
  .detail .tabbar .btn { box-shadow: none; background: transparent; color: var(--ink2); }
  .detail .tabbar .btn.on { background: var(--white); color: var(--ink); box-shadow: var(--shadow); }
  .detail .tabbar .eyebrow { margin-left: auto; padding-right: 8px; }
  .pane { background: var(--white); border-radius: 10px; box-shadow: var(--shadow); min-height: 220px; max-height: 62vh; overflow: auto; }
  .steps { padding: 6px 0; }
  .step { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 7px 16px; font-size: 13.5px; align-items: start; }
  .step + .step { border-top: 1px solid #f1f1f1; }
  .step .role { display: flex; align-items: center; gap: 6px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .3px; color: var(--ink2); padding-top: 2px; }
  .step .role i { width: 8px; height: 8px; border-radius: 3px; }
  .r-orchestrator.role i { background: #8c6cff; } .r-coder.role i { background: #4f86ff; } .r-qa.role i { background: #1db464; } .r-debugger.role i { background: #f08a2c; } .r-user.role i, .r-system.role i { background: #999; }
  .tool { font: 400 12.5px var(--mono); color: var(--ink); }
  .tool .arg { color: var(--mute); }
  .think { color: var(--ink2); }
  details summary { cursor: pointer; color: var(--mute); font: 400 12px var(--mono); list-style: none; margin-top: 3px; }
  details summary::before { content: "+ "; } details[open] summary::before { content: "− "; }
  details.err summary { color: var(--bad); }
  pre { font: 400 12px/1.55 var(--mono); background: #fafafa; border: 1px solid #efefef; border-radius: 8px; padding: 10px 12px; margin: 6px 0 2px; overflow: auto; max-height: 320px; white-space: pre-wrap; word-break: break-word; color: #333; }
  .diff { font: 400 12.5px/1.6 var(--mono); padding: 12px 0; white-space: pre; }
  .diff div { padding: 0 16px; }
  .diff .add { background: #ecfbf2; color: #0f7a3d; } .diff .del { background: #fdf0f0; color: #b4282d; } .diff .hunk { color: var(--blue); background: #f4f7ff; } .diff .fileh { color: var(--ink); font-weight: 500; background: var(--soft); padding-top: 6px; padding-bottom: 6px; margin-top: 4px; }
  .prdoc { padding: 20px 24px; font-size: 14.5px; line-height: 1.6; }
  .prdoc h2 { font-size: 20px; letter-spacing: -.5px; margin: 0 0 14px; }
  .prdoc h4 { margin: 18px 0 6px; font-size: 15px; letter-spacing: -.2px; }
  .prdoc table { border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  .prdoc td, .prdoc th { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
  .prdoc th { background: var(--soft); font-weight: 600; }
  .muted { color: var(--mute); }
  .blank { padding: 40px; text-align: center; color: var(--mute); font-size: 14px; }
  @media (max-width: 980px) { .task { grid-template-columns: 1fr; height: auto; } .chat { height: 70vh; } .how { grid-template-columns: 1fr 1fr; } .home h1 { font-size: 40px; } }
</style>
</head>
<body>
<div class="bar">
  <div class="logo" onclick="goHome()"><i></i>Nightshift</div>
  <div class="tabs"><button class="btn sm on" id="navNew" onclick="goHome()">New task</button><button class="btn sm" id="navTasks" onclick="goHome(true)">Tasks</button></div>
  <div class="env" id="env"></div>
</div>
<div id="view"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = (p, opts = {}) => fetch("/api" + p, { headers: { "content-type": "application/json" }, ...opts }).then((r) => r.json());
const LIVE = ["queued", "planning", "running", "evaluating"];
const STAGES = ["setup", "coding", "qa", "debugging"];
const ROLE_NAME = { orchestrator: "Orchestrator", coder: "Coder", qa: "QA", debugger: "Debugger", user: "You", system: "System" };
let userPicked = false, current = null, source = null, events = [], detail = null, selected = null, tab = "activity", timer = null, info = {};
let draft = { repo: localStorage.getItem("ns.repo") || "", base: localStorage.getItem("ns.base") || "main", attempts: 2 };

api("/info").then((i) => {
  info = i;
  $("#env").innerHTML = `${i.demo ? `<span class="chip warn">Demo · scripted model</span>` : `<span class="chip">${esc(i.provider)}</span>`}<span class="chip">${esc(i.sandbox)} sandbox</span><span class="chip">PRs: ${esc(i.prs)}</span>`;
});

// ---------------- home ----------------
const IDEAS = [
  "Fix the off-by-one in pagination and add a test",
  "add() returns the wrong result, fix it",
  "Make the date parser handle time zones",
  "Raise a clear error when the config file is missing",
];

async function goHome(scrollToTasks) {
  if (source) source.close();
  current = null; location.hash = "";
  $("#navNew").classList.toggle("on", !scrollToTasks); $("#navTasks").classList.toggle("on", !!scrollToTasks);
  const tasks = await api("/tasks");
  $("#view").innerHTML = `
  <div class="home">
    <div class="eyebrow">Background coding agents</div>
    <h1>Hand off the task.<br/>Wake up to a reviewed PR.</h1>
    <p class="sub">An orchestrator runs parallel coder agents, a QA agent checks every change, and a debugger fixes what QA finds. You can step in at any point.</p>
    <div class="composer"><div class="inner">
      <textarea id="prompt" placeholder="What should the agents work on?">${esc(draft.prompt || "")}</textarea>
      <div class="row">
        <label class="field repo"><span>Repo</span><input id="repo" value="${esc(draft.repo)}" placeholder="github.com/you/repo or a local path" /></label>
        <label class="field branch"><span>Branch</span><input id="base" value="${esc(draft.base)}" /></label>
        <div class="seg"><span>Attempts</span>${[1, 2, 3, 4].map((n) => `<button class="${n === draft.attempts ? "on" : ""}" onclick="setAttempts(${n})">${n}</button>`).join("")}</div>
        <button class="btn primary go" onclick="startTask()">Start task →</button>
      </div>
    </div></div>
    <div class="ideas">${IDEAS.map((t) => `<span class="idea" onclick="useIdea(this)">${esc(t)}</span>`).join("")}</div>
    <div class="how">
      <div><i class="dotk r-orchestrator"></i><b>Orchestrator</b><p>Plans different approaches, unblocks agents, picks the winner.</p></div>
      <div><i class="dotk r-coder"></i><b>Coders</b><p>Work in parallel, each on its own branch and sandbox.</p></div>
      <div><i class="dotk r-qa"></i><b>QA</b><p>Checks each change independently and runs the tests itself.</p></div>
      <div><i class="dotk r-debugger"></i><b>Debugger</b><p>Finds the root cause of what QA rejects, then fixes it.</p></div>
    </div>
    <div class="recent" id="recent">
      <div class="eyebrow">Your tasks</div>
      <h2>Recent work</h2>
      <div class="list">${tasks.length ? tasks.map(itemHtml).join("") : `<div class="empty-list">Nothing yet. Start a task above.</div>`}</div>
    </div>
  </div>`;
  $("#prompt").onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) startTask(); };
  $("#prompt").oninput = (e) => (draft.prompt = e.target.value);
  if (scrollToTasks) $("#recent").scrollIntoView({ behavior: "smooth" });
}

const itemHtml = (t) => `<div class="item" onclick="openTask('${t.id}')">
  <div class="t">${esc(t.prompt.split("\n")[0])}</div><div class="st">${statusHtml(t.status)}</div>
  <div class="m">${esc(shortRepo(t.repo))} · ${t.numAttempts} attempt${t.numAttempts > 1 ? "s" : ""} · ${ago(t.createdAt)}</div></div>`;

function setAttempts(n) { draft.attempts = n; document.querySelectorAll(".seg button").forEach((b, i) => b.classList.toggle("on", i + 1 === n)); }
function useIdea(el) { $("#prompt").value = el.textContent; draft.prompt = el.textContent; $("#prompt").focus(); }

async function startTask() {
  const prompt = $("#prompt").value.trim(), repo = $("#repo").value.trim(), baseBranch = $("#base").value.trim() || "main";
  if (!prompt) return $("#prompt").focus();
  if (!repo) return $("#repo").focus();
  localStorage.setItem("ns.repo", repo); localStorage.setItem("ns.base", baseBranch);
  draft = { repo, base: baseBranch, attempts: draft.attempts };
  const t = await api("/tasks", { method: "POST", body: JSON.stringify({ prompt, repo, baseBranch, numAttempts: draft.attempts }) });
  if (t.error) return alert(t.error);
  openTask(t.id);
}

// ---------------- task ----------------
async function openTask(id) {
  if (source) source.close();
  current = id; events = []; selected = null; userPicked = false; tab = "activity"; location.hash = id;
  $("#navNew").classList.remove("on"); $("#navTasks").classList.remove("on");
  $("#view").innerHTML = `
  <div class="task">
    <aside class="chat">
      <div class="head"><b>Agent team</b><span class="eyebrow" id="chatState"></span></div>
      <div class="team"><span class="who r-orchestrator"><i></i>Orchestrator</span><span class="who r-coder"><i></i>Coders</span><span class="who r-qa"><i></i>QA</span><span class="who r-debugger"><i></i>Debugger</span></div>
      <div class="msgs" id="msgs"></div>
      <div class="send"><div class="box">
        <textarea id="steerText" rows="2" placeholder="Message the agents while they work…"></textarea>
        <div class="row"><select id="steerTarget"></select><button class="btn primary" id="steerBtn" onclick="steer()">Send</button></div>
      </div><div class="hint" id="steerHint">Agents read new messages before their next step</div></div>
    </aside>
    <main class="work" id="work"></main>
  </div>`;
  $("#steerText").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); steer(); } };
  detail = await api(`/tasks/${id}`);
  renderWork();
  source = new EventSource(`/api/tasks/${id}/stream`);
  source.onmessage = (m) => {
    const e = JSON.parse(m.data);
    events.push(e);
    addChat(e);
    if (tab === "activity" && selected && e.attemptId === selected) addStep(e);
    if (/status|created|pr|setup|verdict|evaluation|diagnosis/.test(e.kind)) schedule();
  };
}

function schedule() { clearTimeout(timer); timer = setTimeout(async () => { detail = await api(`/tasks/${current}`); renderWork(); }, 150); }

function renderWork() {
  const { task, attempts, paused } = detail;
  const live = LIVE.includes(task.status);
  if (attempts.length && (!selected || (!userPicked && task.winnerAttemptId))) selected = task.winnerAttemptId || attempts[0].id;
  const st = paused && live ? "paused" : task.status;
  $("#chatState").textContent = live ? (paused ? "paused" : "working") : task.status;
  const sel = $("#steerTarget"), keep = sel.value;
  sel.innerHTML = `<option value="">All attempts</option>${attempts.map((a) => `<option value="${a.id}">Attempt ${a.index} · ${esc(a.strategy.name)}</option>`).join("")}`;
  sel.value = keep;
  for (const el of [$("#steerText"), sel, $("#steerBtn")]) el.disabled = !live;
  $("#steerHint").textContent = live ? "Agents read new messages before their next step" : "This task has finished";
  const winner = attempts.find((a) => a.id === task.winnerAttemptId);
  const prEv = [...events].reverse().find((e) => e.kind === "pr");

  $("#work").innerHTML = `
    <div class="top">
      <div class="meta"><span class="eyebrow">Task</span>${statusHtml(st)}<span style="flex:1"></span>
        <div class="actions">${live ? `<button class="btn sm" onclick="act('${paused ? "resume" : "pause"}')">${paused ? "Resume" : "Pause"}</button><button class="btn sm danger" onclick="act('cancel')">Cancel</button>` : ""}</div></div>
      <h1>${esc(task.prompt)}</h1>
      <div class="meta"><code>${esc(shortRepo(task.repo))}</code><span>on</span><code>${esc(task.baseBranch)}</code><span>·</span><span>${task.numAttempts} parallel attempt${task.numAttempts > 1 ? "s" : ""}</span><span>·</span><span>started ${ago(task.createdAt)}</span></div>
    </div>
    ${task.status === "done" && winner ? `<div class="result ok"><div class="inner"><div class="ico">✓</div><div><b>Attempt ${winner.index} (${esc(winner.strategy.name)}) is ready to merge</b><span>${task.prUrl ? `Pull request opened: <a href="${esc(task.prUrl)}" target="_blank">${esc(task.prUrl)}</a>` : `On branch <code>${esc(winner.branch)}</code>. ${esc((prEv?.data.reason) ? "PR not opened: " + prEv.data.reason : "")}`}</span></div>
      <button class="btn" onclick="selected='${winner.id}';userPicked=true;tab='pr';renderWork()">View PR</button></div></div>` : ""}
    ${task.status === "failed" || task.status === "cancelled" ? `<div class="result bad"><div class="inner"><div class="ico">!</div><div><b>${task.status === "cancelled" ? "Cancelled" : "No attempt passed review"}</b><span>${esc(task.summary || "")}</span></div></div></div>` : ""}
    <div class="section-h"><h3>Attempts</h3><span class="eyebrow">${attempts.filter((a) => a.status === "passed").length} of ${attempts.length} passed</span></div>
    <div class="attempts">${attempts.length ? attempts.map((a) => attemptHtml(a, task)).join("") : `<div class="att"><div class="inner muted">The orchestrator is planning the attempts…</div></div>`}</div>
    ${attempts.length ? `<div class="detail">
      <div class="tabbar">
        ${["activity", "diff", "pr"].map((t) => `<button class="btn sm ${tab === t ? "on" : ""}" onclick="setTab('${t}')">${{ activity: "Activity", diff: "Diff", pr: "PR description" }[t]}</button>`).join("")}
        <span class="eyebrow">${esc(attemptName(selected))}</span>
      </div>
      <div class="pane" id="pane"></div></div>` : ""}`;
  if (attempts.length) renderPane();
}

function attemptHtml(a, task) {
  const winner = task.winnerAttemptId === a.id;
  const idx = STAGES.indexOf(a.status);
  const end = ["passed", "failed", "cancelled"].includes(a.status);
  const pipe = STAGES.map((s, i) => {
    let c = "";
    if (end) c = a.status === "passed" ? (s === "debugging" && !a.fixRounds ? "" : "ok") : i <= (a.fixRounds ? 3 : 2) ? "bad" : "";
    else if (i < idx) c = s === "debugging" && !a.fixRounds ? "" : "ok"; else if (i === idx) c = "on";
    return `<div class="${c}">${s === "qa" ? "QA" : s}</div>`;
  }).join("");
  const canShip = !LIVE.includes(task.status) && a.status === "passed" && !winner;
  return `<div class="att ${selected === a.id ? "sel" : ""}" onclick="selectAttempt('${a.id}')"><div class="inner">
    <div class="h"><span class="n">Attempt ${a.index}</span>${statusHtml(winner ? "shipped" : a.status)}</div>
    <div class="name">${esc(a.strategy.name)}</div>
    <div class="ins">${esc(a.strategy.instructions)}</div>
    <div class="pipe">${pipe}</div>
    <div class="stats"><span>Score <b>${a.score ?? "–"}</b></span><span>Fixes <b>${a.fixRounds}</b></span><span>Setup <b>${a.setupMs == null ? "–" : (a.setupMs / 1000).toFixed(1) + "s"}</b>${a.setupCached ? " cached" : ""}</span></div>
    ${canShip ? `<div class="foot"><button class="btn sm" onclick="event.stopPropagation();ship('${a.id}')">Ship this instead</button></div>` : ""}
  </div></div>`;
}

function selectAttempt(id) { selected = id; userPicked = true; renderWork(); }
function setTab(t) { tab = t; renderWork(); }
function attemptName(id) { const a = detail?.attempts.find((x) => x.id === id); return a ? `Attempt ${a.index} · ${a.strategy.name}` : ""; }

function renderPane() {
  const pane = $("#pane"), a = detail.attempts.find((x) => x.id === selected);
  if (!a) return;
  if (tab === "activity") {
    pane.innerHTML = `<div class="steps" id="steps"></div>`;
    events.filter((e) => e.attemptId === selected).forEach(addStep);
    if (!$("#steps").children.length) pane.innerHTML = `<div class="blank">Waiting for this attempt to start…</div>`;
    pane.scrollTop = pane.scrollHeight;
  } else if (tab === "diff") {
    pane.innerHTML = a.diff ? `<div class="diff">${colorDiff(a.diff)}</div>` : `<div class="blank">The diff is captured when QA finishes reviewing this attempt.</div>`;
  } else {
    const pr = [...events].reverse().find((e) => e.kind === "pr" && e.attemptId === selected);
    pane.innerHTML = pr ? `<div class="prdoc"><h2>${esc(pr.data.title)}</h2>${md(pr.data.body)}</div>` : `<div class="blank">${a.id === detail.task.winnerAttemptId || LIVE.includes(detail.task.status) ? "The PR description appears once the orchestrator picks a winner." : "This attempt was not shipped. Use “Ship this instead” to open a PR from it."}</div>`;
  }
}

// One technical step in the Activity pane.
function addStep(e) {
  const steps = $("#steps");
  if (!steps) { if (tab === "activity" && $("#pane")) { $("#pane").innerHTML = `<div class="steps" id="steps"></div>`; return addStep(e); } return; }
  const d = e.data || {};
  if (e.kind === "tool.result" && d.id) {
    const row = steps.querySelector(`[data-call="${CSS.escape(d.id)}"] .body`);
    if (row) { row.insertAdjacentHTML("beforeend", `<details class="${d.error ? "err" : ""}" ${d.error ? "open" : ""}><summary>${d.error ? "error" : "output"}</summary><pre>${esc(d.output)}</pre></details>`); return; }
  }
  let body = "";
  switch (e.kind) {
    case "tool.call": body = `<div class="tool">${esc(d.name)} <span class="arg">${esc(argSummary(d.name, d.args))}</span></div>`; break;
    case "tool.result": body = d.name === "orchestrator_tests" ? `<div class="tool">ran the test suite <span class="arg">${d.error ? "failing" : "passing"}</span></div><details><summary>output</summary><pre>${esc(d.output)}</pre></details>` : `<details><summary>${esc(d.name)} output</summary><pre>${esc(d.output)}</pre></details>`; break;
    case "llm.text": body = `<div class="think">${esc(d.text)}</div>`; break;
    case "setup": body = d.phase === "attempt" ? `<div class="think">Environment ready in ${(d.ms / 1000).toFixed(1)}s${d.cached ? ", restored from the dependency cache" : d.ran ? ", dependencies installed" : ""}</div>` : ""; break;
    case "attempt.status": body = `<div class="muted">→ ${esc(d.status)}${d.round !== undefined ? ` · round ${d.round + 1}` : ""}</div>`; break;
    case "steer.delivered": body = `<div class="muted">Read your message: “${esc(d.text)}”</div>`; break;
    case "error": body = `<div style="color:var(--bad)">${esc(d.message)}</div>`; break;
    default: return;
  }
  if (!body) return;
  const el = document.createElement("div");
  el.className = "step";
  if (e.kind === "tool.call") el.dataset.call = d.id;
  el.innerHTML = `<div class="role r-${e.role}"><i></i>${esc(ROLE_NAME[e.role] || e.role)}</div><div class="body">${body}</div>`;
  const pane = $("#pane"), stick = pane.scrollTop + pane.clientHeight > pane.scrollHeight - 80;
  steps.appendChild(el);
  if (stick) pane.scrollTop = pane.scrollHeight;
}

// The conversation: what the team says to you and to each other.
function addChat(e) {
  const box = $("#msgs"); if (!box) return;
  const d = e.data || {}, who = attemptTag(e.attemptId);
  let cls = "", text = "", note = "";
  switch (e.kind) {
    case "task.created": cls = "user"; text = esc(d.prompt); break;
    case "plan": text = `I'll try ${d.strategies.length} approach${d.strategies.length > 1 ? "es" : ""} in parallel:<ol>${d.strategies.map((s) => `<li><b>${esc(s.name)}</b>: ${esc(s.instructions.split("\nNote:")[0])}</li>`).join("")}</ol>`; break;
    case "setup": if (d.phase === "config") note = `Detected tests: ${d.config.test || "none"}${d.config.setup ? ` · setup: ${d.config.setup}` : ""}`; else if (d.phase === "base") note = `Dependencies ${d.cached ? "restored from cache" : "installed"} in ${(d.ms / 1000).toFixed(1)}s`; break;
    case "report": if (e.role === "coder" || e.role === "qa" || (e.role === "debugger" && d.status !== "done")) text = `${d.status === "blocked" ? "<b>Blocked:</b> " : d.status === "done" ? "<b>Done.</b> " : ""}${esc(d.message)}`; break;
    case "verdict": cls = d.pass ? "pass" : "fail"; text = `<b>${d.pass ? "Approved" : "Changes needed"}</b> · ${d.score}/10 · tests ${d.testsPassed === null ? "n/a" : d.testsPassed ? "passing" : "failing"}\n${esc(d.summary)}${d.problems.length ? `<ul>${d.problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}`; break;
    case "diagnosis": text = `<b>Root cause:</b> ${esc(d.root_cause)}\n<b>Fix:</b> ${esc(d.fix)}`; break;
    case "evaluation":
      if (d.decision === "winner") { cls = "win"; text = `<b>Shipping attempt ${idx(d.attemptId)}.</b> ${esc(d.reason)}`; }
      else if (d.decision === "guidance") text = `Guidance: ${esc(d.reason)}`;
      else if (d.decision === "send-to-debugger") note = `${who}: sent to the debugger`;
      else if (d.decision === "give-up") note = `${who}: stopped after ${d.round} fix round${d.round === 1 ? "" : "s"}`;
      else if (d.decision === "no-winner") { cls = "fail"; text = esc(d.summary); }
      break;
    case "steer": cls = "user"; text = esc(d.text); break;
    case "pr": text = d.url ? `Pull request opened: <a href="${esc(d.url)}" target="_blank">${esc(d.url)}</a>` : `The branch is ready. PR not opened (${esc(d.reason)}).`; break;
    case "task.status": if (d.paused !== undefined) note = d.paused ? "Paused by you" : "Resumed"; else if (d.status === "cancelled") note = "Task cancelled"; break;
    case "error": cls = "fail"; text = esc(d.message); break;
  }
  if (note) { box.insertAdjacentHTML("beforeend", `<div class="note">${esc(note)}</div>`); scrollChat(); return; }
  if (!text) return;
  const role = e.kind === "task.created" || e.kind === "steer" ? "user" : e.role;
  const target = e.kind === "steer" ? (d.target === "all" ? "to all attempts" : `to ${attemptTag(d.target)}`) : who;
  box.insertAdjacentHTML("beforeend", `<div class="m ${cls}"><div class="meta"><span class="who r-${role}"><i></i>${esc(ROLE_NAME[role] || role)}</span><small>${esc(target)}</small></div><div class="bubble">${text}</div></div>`);
  scrollChat();
}
function scrollChat() { const b = $("#msgs"); if (b) b.scrollTop = b.scrollHeight; }

async function steer() {
  const text = $("#steerText").value.trim(); if (!text) return;
  $("#steerText").value = "";
  await api(`/tasks/${current}/steer`, { method: "POST", body: JSON.stringify({ text, attemptId: $("#steerTarget").value || null }) });
}
async function act(a) { await api(`/tasks/${current}/${a}`, { method: "POST" }); schedule(); }
async function ship(id) { await api(`/tasks/${current}/select`, { method: "POST", body: JSON.stringify({ attemptId: id }) }); selected = id; userPicked = true; tab = "pr"; schedule(); }

// ---------------- helpers ----------------
const statusHtml = (s) => `<span class="status ${esc(s)}">${esc(s)}</span>`;
const idx = (id) => detail?.attempts.find((a) => a.id === id)?.index ?? (id || "").split("_").pop();
const attemptTag = (id) => (id ? `attempt ${idx(id)}` : "");
const shortRepo = (r) => r.replace(/^https?:\/\/(www\.)?github\.com\//, "").replace(/\.git$/, "");
function ago(ts) { const s = (Date.now() - new Date(ts)) / 1000; return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : new Date(ts).toLocaleDateString(); }
function argSummary(name, a = {}) {
  if (a.path) return a.path + (a.old_string ? "  (edit)" : "");
  if (a.command) return "$ " + a.command;
  if (a.pattern) return "/" + a.pattern + "/";
  if (name === "submit_verdict") return a.pass ? "pass" : "fail";
  return a.message || a.summary || a.root_cause || "";
}
function colorDiff(t) {
  return t.split("\n").map((l) => {
    const c = l.startsWith("diff --git") ? "fileh" : l.startsWith("@@") ? "hunk" : l.startsWith("+") && !l.startsWith("+++") ? "add" : l.startsWith("-") && !l.startsWith("---") ? "del" : "";
    if (/^(index |--- |\+\+\+ |new file mode)/.test(l)) return "";
    return `<div class="${c}">${esc(c === "fileh" ? l.replace(/^diff --git a\/(\S+) b\/.*/, "$1") : l) || " "}</div>`;
  }).join("");
}
// Minimal markdown for the PR body: headings, bold, tables, lists, code blocks, details.
function md(src) {
  const out = []; const lines = src.split("\n"); let i = 0;
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/_(Opened by Nightshift\.)_/, "<span class='muted'>$1</span>");
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) { const buf = []; i++; while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]); out.push(`<pre>${esc(buf.join("\n"))}</pre>`); i++; continue; }
    if (l.startsWith("## ")) out.push(`<h4>${inline(l.slice(3))}</h4>`);
    else if (l.startsWith("|")) { const rows = []; while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]); out.push(`<table>${rows.filter((r) => !/^\|[-| ]+\|$/.test(r)).map((r, k) => `<tr>${r.split("|").slice(1, -1).map((c) => k ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join("")}</tr>`).join("")}</table>`); continue; }
    else if (/^\d+\. /.test(l)) out.push(`<div>${inline(l)}</div>`);
    else if (/^<\/?details>|^<summary>/.test(l)) out.push(l.startsWith("<summary>") ? `<div class="muted" style="margin-top:14px">${esc(l.replace(/<\/?summary>/g, ""))}</div>` : "");
    else if (l.trim()) out.push(`<p style="margin:4px 0">${inline(l)}</p>`);
    i++;
  }
  return out.join("");
}

const fromHash = location.hash.slice(1);
fromHash ? openTask(fromHash) : goHome();
</script>
</body>
</html>
